<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YukiChess</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>YukiChess</h1>

      <div class="status-bar">
        <p id="status-msg">Vez das brancas</p>
        <button id="new-game-btn" type="button">Novo jogo</button>
      </div>

      <div class="game-area">
        <div class="side-trays">
          <div id="captured-black" class="tray tray-black"></div>
          <div id="captured-white" class="tray tray-white"></div>
        </div>
        <div id="board" class="board"></div>
        <div class="history-panel">
          <h2>Lances</h2>
          <div id="history" class="history-list"></div>
        </div>
      </div>

      <p id="error-msg" class="error"></p>
    </main>
  </body>
</html>
