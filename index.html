<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YukiChess</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>YukiChess</h1>

      <div class="status-bar">
        <p id="status-msg">Vez das brancas</p>
        <button id="new-game-btn" type="button">Novo jogo</button>
      </div>

      <div class="engine-controls">
        <label class="engine-toggle">
          <input type="checkbox" id="vs-engine-toggle" />
          Jogar contra o Stockfish
        </label>
        <label class="engine-field">
          Você joga:
          <select id="human-color-select">
            <option value="White">Brancas</option>
            <option value="Black">Pretas</option>
          </select>
        </label>
        <label class="engine-field">
          Força: <span id="elo-value">1500</span>
          <input type="range" id="elo-slider" min="1320" max="2800" step="20" value="1500" />
        </label>
        <button id="hint-btn" type="button">Dica</button>
      </div>
      <p id="engine-status-msg" class="engine-status"></p>

      <div class="game-area">
        <div class="side-trays">
          <div id="captured-black" class="tray tray-black"></div>
          <div id="captured-white" class="tray tray-white"></div>
        </div>
        <div class="eval-bar-wrap">
          <span id="eval-label" class="eval-label">—</span>
          <div class="eval-bar">
            <div id="eval-bar-fill" class="eval-bar-fill"></div>
          </div>
        </div>
        <div id="board" class="board"></div>
        <div class="history-panel">
          <h2>Lances</h2>
          <div id="history" class="history-list"></div>
        </div>
      </div>

      <p id="move-quality-msg" class="move-quality"></p>
      <p id="error-msg" class="error"></p>
    </main>
  </body>
</html>
